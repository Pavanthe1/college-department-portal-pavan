apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-department-portal-pavan
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-department-portal-pavan
  template:
    metadata:
      labels:
        app: college-department-portal-pavan
    spec:
      containers:
        - name: college-department-portal-pavan
          image: raghavendrasaladi/college-department-portal-pavan:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: college-department-service-pavan
spec:
  type: NodePort
  selector:
    app: college-department-portal-pavan
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30018
